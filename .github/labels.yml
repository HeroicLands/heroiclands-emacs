# Authoritative label registry for the heroiclands-emacs repository.
#
# This file is the machine-readable source of truth for §3 of
# .github/ISSUE_REPORTING.md. Editing the registry means editing BOTH: this file
# (name/color/description) and the §3 table.
#
# GitHub's labels are reconciled to this file by the org-wide
# `HeroicLands/.github/actions/labels` action, run by
# .github/workflows/labels-sync.yml. A pull request touching this file reports
# what a sync would change without writing. The set is CLOSED: any label on
# GitHub that is not listed here is deleted on sync. Do not invent labels —
# extending the registry is a deliberate edit to this file and §3.
#
# The registry is deliberately NARROWER than sohl-thalorna's, which is itself
# narrower than the system repository's. This repository ships an Emacs package:
# there is no setting content and no website, so `content` and `site` have no
# meaning here and are absent. Colours and descriptions are otherwise the
# org's, so a label means the same thing wherever it is seen.

- name: documentation
  color: "0075ca"
  description: Documentation about this repository — README, the Info manual, docstrings, process.

- name: devops
  color: "e07b31"
  description: Build, tooling, CI, release, repo config.

- name: security
  color: "b60205"
  description: "Attack surface: evaluating untrusted content, file-local variables, or subprocess handling."

- name: tech-debt
  color: "68691b"
  description: Restructuring or cleanup of working code; refactors.

- name: regression
  color: "d93f0b"
  description: Something that previously worked and stopped. Pairs with type bug.

- name: breaking-change
  color: "8d0f09"
  description: Alters a command name, key binding, variable, or the mode's activation rule.

- name: blocked
  color: "c5702e"
  description: Cannot proceed until an external dependency or another issue clears.

- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists.

- name: question
  color: "0f5594"
  description: Further information is requested.

- name: wontfix
  color: "ffffff"
  description: This will not be worked on.
